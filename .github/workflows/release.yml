name: Release

# Pushing a tag like v1.2.3 (or v1.2.3-rc.1, published as a pre-release)
# runs the full CI, then publishes prebuilt packages to GitHub Releases:
# linux/windows/darwin × amd64/arm64, each with LICENSE, THIRD_PARTY_NOTICES
# and README.md, plus SHA256SUMS and build provenance attestations. The
# release is then synced to Gitee.
#
# Repository secret: GITEE_TOKEN. Repository variables (optional):
# GITEE_OWNER (default Abjust) and GITEE_REPO (default msstnetRelay31x).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write     # create the release
      id-token: write     # sign provenance
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false   # release builds do not reuse caches
      - name: Build packages
        env:
          VERSION: ${{ github.ref_name }}
        run: scripts/build-release.sh "$VERSION" dist
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          flags=()
          if [[ $VERSION == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$VERSION" dist/* \
            --verify-tag --generate-notes --title "msstnetRelay31x $VERSION" "${flags[@]}"

  sync-gitee:
    name: Sync the Release to Gitee
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      # Only this tag's release: created on Gitee if missing, its missing
      # files uploaded; other releases are left alone.
      - run: .github/scripts/sync-gitee-release.sh
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          GITEE_OWNER: ${{ vars.GITEE_OWNER || 'Abjust' }}
          GITEE_REPO: ${{ vars.GITEE_REPO || 'msstnetRelay31x' }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          RETRIES: 3
