name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
  # Release tags run this through release.yml before publishing.
  workflow_call:

permissions:
  contents: read

concurrency:
  # Fixed prefix: when called from release.yml, github.workflow is the
  # caller's name and would collide with its concurrency group.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Native vet and tests on each OS (UDP sockets, file handling and signal
  # handling differ between platforms).
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            race: "-race"
          - os: macos-latest
            race: "-race"
          # The race detector needs cgo and a C toolchain on Windows; run
          # the suite without it there.
          - os: windows-latest
            race: ""
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - name: go mod verify
        run: go mod verify
      # Every third-party module linked into a release binary must be listed
      # with its exact version in THIRD_PARTY_NOTICES.
      - name: third-party notices
        if: runner.os == 'Linux'
        run: |
          mods=$(for goos in linux windows darwin; do
            GOOS=$goos go list -deps -f '{{if not .Standard}}{{with .Module}}{{if not .Main}}{{.Path}} {{.Version}}{{end}}{{end}}{{end}}' .
          done | sort -u)
          status=0
          while read -r mod; do
            [ -z "$mod" ] && continue
            if ! grep -qF "$mod" THIRD_PARTY_NOTICES; then
              echo "THIRD_PARTY_NOTICES is missing: $mod"; status=1
            fi
          done <<< "$mods"
          exit $status
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ${{ matrix.race }} -count=1 ./...

  # Static release binaries. Pure Go, so every target is cross-compiled on
  # Linux; the test job above covers each OS natively.
  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          ext=""
          if [ "$GOOS" = windows ]; then ext=".exe"; fi
          out="dist/msstnetRelay31x-${GOOS}-${GOARCH}${ext}"
          go build -trimpath -ldflags="-s -w" -o "$out" .
          cp LICENSE THIRD_PARTY_NOTICES README.md dist/
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: msstnetRelay31x-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          if-no-files-found: error
