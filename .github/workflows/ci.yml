name: CI

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Native vet and tests on each OS (UDP sockets, file handling and signal
  # handling differ between platforms).
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            race: "-race"
          - os: macos-latest
            race: "-race"
          # The race detector needs cgo and a C toolchain on Windows; run
          # the suite without it there.
          - os: windows-latest
            race: ""
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - name: go mod verify
        run: go mod verify
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ${{ matrix.race }} -count=1 ./...

  # Static release binaries. Pure Go, so every target is cross-compiled on
  # Linux; the test job above covers each OS natively.
  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          ext=""
          if [ "$GOOS" = windows ]; then ext=".exe"; fi
          out="dist/msstnetRelay31x-${GOOS}-${GOARCH}${ext}"
          go build -trimpath -ldflags="-s -w" -o "$out" .
          cp LICENSE README.md dist/
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: msstnetRelay31x-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          if-no-files-found: error
